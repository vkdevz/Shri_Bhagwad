             C 346 150, 356 250, 256 316 
             C 156 250, 166 150, 256 100 Z" 
          fill="none" stroke="#e5c178" stroke-width="16" stroke-linejoin="round"/>

    <!-- Inner Sacred Chandrika Eye (Solid Gold Drop) -->
