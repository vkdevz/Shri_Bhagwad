    <ellipse cx="256" cy="236" rx="16" ry="22" fill="#0e0f12"/>

    <!-- 3 Crown Filaments (Krishna's Mukut Crest) -->
    <line x1="256" y1="100" x2="256" y2="46" stroke="#e5c178" stroke-width="10" stroke-linecap="round"/>
    <circle cx="256" cy="36" r="11" fill="#e5c178"/>

    <line x1="242" y1="106" x2="204" y2="58" stroke="#e5c178" stroke-width="8" stroke-linecap="round"/>
    <circle cx="196" cy="50" r="9" fill="#e5c178"/>

    <line x1="270" y1="106" x2="308" y2="58" stroke="#e5c178" stroke-width="8" stroke-linecap="round"/>
    <circle cx="316" cy="50" r="9" fill="#e5c178"/>
  </g>
</svg>
