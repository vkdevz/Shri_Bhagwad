<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0e0f12"/>
  <g transform="translate(256, 260) rotate(14) translate(-256, -260)">
    <!-- Feather Stem / Quill -->
    <path d="M 256 120 C 256 220, 248 300, 196 410" 
          fill="none" stroke="#e5c178" stroke-width="15" stroke-linecap="round"/>

    <!-- Outer Feather Teardrop / Leaf -->
